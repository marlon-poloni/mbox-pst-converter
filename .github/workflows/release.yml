name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pacotes:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            bundles: deb
          - os: windows-latest
            rid: win-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/independent/requirements.txt
      - name: Testes antes de empacotar
        env:
          MBOXPST_PYTHON: python
        run: dotnet test -c Release
      - name: Núcleo C#
        shell: bash
        run: scripts/build-sidecar.sh ${{ matrix.rid }}
      - run: npm ci
        working-directory: app
      - run: npx tauri build --bundles ${{ matrix.bundles }}
        working-directory: app
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/nsis/*.exe
